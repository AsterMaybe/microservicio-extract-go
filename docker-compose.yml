# Microservicio Go (extracción de PDF) — se publica únicamente a través de
# Traefik (misma infraestructura que el monolito). No publica puertos: todo el
# tráfico entra por el gateway.
# Proyecto aislado: evita que `docker compose up` de otra ficha borre los
# contenedores de las demás (todas comparten la red externa).
# Service discovery via Consul Catalog (Phase 6) - no Traefik labels needed.
name: microservicio-go

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: microservicio-api:0.1.0
    restart: unless-stopped
    # Inmutabilidad en runtime (D1/D4): UID/GID fijo, rootfs de solo lectura,
    # sin capabilities y sin escalada de privilegios.
    user: "10001:10001"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    expose:
      - "8080"
    environment:
      # El extractor es stateless: su única dependencia de datos es Redis
      # (caché por SHA-256), que corre en la red compartida con el monolito.
      - GIN_MODE=${GIN_MODE:-release}
      # Tamaño máximo de PDF en MB (default 25).
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-25}
      # Redis: caché de extracciones por SHA-256 del binario. Un hit devuelve
      # 200 sin volver a parsear. Corre en la red compartida del monolito.
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      # CACHÉ: vida de cada entrada.
      - CACHE_TTL=${CACHE_TTL:-24h}
      # Límite de una ida y vuelta a Redis: una caché colgada cueste un timeout,
      # no una petición colgada.
      - REDIS_TIMEOUT=${REDIS_TIMEOUT:-2s}
      # Backpressure híbrido: cola acotada + timeout de admisión.
      #   CONCURRENCY        extracciones simultáneas (0 = una por core de CPU)
      #   QUEUE_SIZE         cola de espera, tomada ANTES de leer el body: un
      #                      request encolado no sujeta bytes del PDF. Llena ->
      #                      429 inmediato, sin esperar.
      #   MAX_IN_FLIGHT      cuerpos en RAM a la vez; aquí se espera turno, y el
      #                      ADMISSION_TIMEOUT acota esa espera -> 429
      #   ADMISSION_TIMEOUT  presupuesto de espera (< EXTRACTION_TIMEOUT)
      #   EXTRACTION_TIMEOUT presupuesto del parseo en sí -> 504
      - CONCURRENCY=${CONCURRENCY:-0}
      - QUEUE_SIZE=${QUEUE_SIZE:-200}
      - MAX_IN_FLIGHT=${MAX_IN_FLIGHT:-8}
      - ADMISSION_TIMEOUT=${ADMISSION_TIMEOUT:-2s}
      - EXTRACTION_TIMEOUT=${EXTRACTION_TIMEOUT:-30s}
      # Control del GC de Go bajo el límite de 1 GiB de la cgroup. GOMEMLIMIT es
      # un objetivo blando de heap: mantiene el uso por debajo del techo duro y
      # evita el OOM. GOGC>100 espacia las colecciones (menos CPU en GC) a cambio
      # de algo más de memoria, cubierta por GOMEMLIMIT.
      - GOMEMLIMIT=${GOMEMLIMIT:-850MiB}
      - GOGC=${GOGC:-150}
      # Consul registration (via local client agent for Connect sidecar support)
      - CONSUL_HTTP_ADDR=${CONSUL_HTTP_ADDR:-consul-agent-go:8500}
      - CONSUL_HTTP_TOKEN=${CONSUL_HTTP_TOKEN:-}
      # Traefik routing via Consul tags (Phase 6)
      - MICROSERVICE_HOST=${MICROSERVICE_HOST:-extract.localhost}
    # Healthcheck: Using Consul health checks instead of Docker health check
    # because distroless base image lacks shell/curl for CMD-SHELL.
    # Consul registers the service with HTTP health check at /api/v1/health.
    networks:
      - shared-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
      replicas: 5

networks:
  shared-network:
    name: ${SHARED_NETWORK_NAME:-test_network}
    external: true